services:
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: tap2eat-api-gateway
    environment:
      SERVER_PORT: 8080
    depends_on:
      - identity-service
      - catalog-service
      - notification-service
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - tap2eat-network

  identity-service:
    build:
      context: ..
      dockerfile: services/identity-service/Dockerfile
    container_name: tap2eat-identity-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    depends_on:
      - postgres
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - tap2eat-network

  catalog-service:
    build:
      context: ..
      dockerfile: services/catalog-service/Dockerfile
    container_name: tap2eat-catalog-service
    environment:
      SERVER_PORT: 8082
      SPRING_DATA_MONGODB_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/tap2eat_catalog?authSource=admin"

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      POSTAL_CODE_API_BASE_URL: ${POSTAL_CODE_API_BASE_URL}
      POSTAL_CODE_API_TOKEN: ${POSTAL_CODE_API_TOKEN}
      POSTAL_CODE_API_TYPE: ${POSTAL_CODE_API_TYPE}

      DEFAULT_PRODUCT_IMAGE_URL: ${DEFAULT_PRODUCT_IMAGE_URL}
      DEFAULT_PRODUCT_IMAGE_OBJECT_KEY: ${DEFAULT_PRODUCT_IMAGE_OBJECT_KEY}
    depends_on:
      - mongodb
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - tap2eat-network

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: tap2eat-notification-service
    environment:
      SERVER_PORT: ${NOTIFICATION_HTTP_PORT}
      GRPC_SERVER_PORT: ${NOTIFICATION_GRPC_PORT}
      GMAIL_CREDENTIALS_PATH: ${GMAIL_CREDENTIALS_PATH}
      GMAIL_TOKENS_DIR: ${GMAIL_TOKENS_DIR}
      GMAIL_FROM: ${GMAIL_FROM}
    volumes:
      - ../secrets/google/credentials.json:/run/secrets/google/credentials.json:ro
      - ../secrets/google/tokens:/run/secrets/google/tokens
    ports:
      - "${NOTIFICATION_HTTP_PORT}:${NOTIFICATION_HTTP_PORT}"
      - "${NOTIFICATION_GRPC_PORT}:${NOTIFICATION_GRPC_PORT}"
    restart: unless-stopped
    networks:
      - tap2eat-network

  postgres:
    image: postgres:15
    container_name: tap2eat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - tap2eat-network

  mongodb:
    image: mongo:4.4
    container_name: tap2eat-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: tap2eat_catalog
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - tap2eat-network

  neo4j:
    image: neo4j:5-community
    container_name: tap2eat-neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    networks:
      - tap2eat-network

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:

networks:
  tap2eat-network:
    driver: bridge