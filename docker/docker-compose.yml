services:
  identity-service:
    build:
      context: ..
      dockerfile: services/identity-service/Dockerfile
    container_name: tap2eat-identity-service
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    depends_on:
      - postgres
      - mongodb
      - neo4j
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - tap2eat-network

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: tap2eat-notification-service
    environment:
      SERVER_PORT: ${NOTIFICATION_HTTP_PORT}
      GRPC_SERVER_PORT: ${NOTIFICATION_GRPC_PORT}
      GMAIL_CREDENTIALS_PATH: ${GMAIL_CREDENTIALS_PATH}
      GMAIL_TOKENS_DIR: ${GMAIL_TOKENS_DIR}
      GMAIL_FROM: ${GMAIL_FROM}
    volumes:
      - ../secrets/google/credentials.json:/run/secrets/google/credentials.json:ro
      - ../secrets/google/tokens:/run/secrets/google/tokens
    ports:
      - "${NOTIFICATION_HTTP_PORT}:${NOTIFICATION_HTTP_PORT}"
      - "${NOTIFICATION_GRPC_PORT}:${NOTIFICATION_GRPC_PORT}"
    restart: unless-stopped
    networks:
      - tap2eat-network

  postgres:
    image: postgres:15
    container_name: tap2eat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - tap2eat-network

  mongodb:
    image: mongo:latest
    container_name: tap2eat-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - tap2eat-network

  neo4j:
    image: neo4j:latest
    container_name: tap2eat-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    networks:
      - tap2eat-network

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:

networks:
  tap2eat-network:
    driver: bridge