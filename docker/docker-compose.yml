services:
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: tap2eat-api-gateway
    environment:
      SERVER_PORT: 8080
    depends_on:
      - identity-service
      - catalog-service
      - notification-service
      - order-service
      - finance-service
      - recommendation-service
      - reports-python
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - tap2eat-network

  identity-service:
    build:
      context: ..
      dockerfile: services/identity-service/Dockerfile
    container_name: tap2eat-identity-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    depends_on:
      - postgres
    expose:
      - "8081"
    restart: unless-stopped
    networks:
      - tap2eat-network

  catalog-service:
    build:
      context: ..
      dockerfile: services/catalog-service/Dockerfile
    container_name: tap2eat-catalog-service
    environment:
      SERVER_PORT: 8082
      SPRING_DATA_MONGODB_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/tap2eat_catalog?authSource=admin"

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      POSTAL_CODE_API_BASE_URL: ${POSTAL_CODE_API_BASE_URL}
      POSTAL_CODE_API_TOKEN: ${POSTAL_CODE_API_TOKEN}
      POSTAL_CODE_API_TYPE: ${POSTAL_CODE_API_TYPE}

      DEFAULT_PRODUCT_IMAGE_URL: ${DEFAULT_PRODUCT_IMAGE_URL}
      DEFAULT_PRODUCT_IMAGE_OBJECT_KEY: ${DEFAULT_PRODUCT_IMAGE_OBJECT_KEY}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-tap2eat-internal-dev-token}
    depends_on:
      - mongodb
    expose:
      - "8082"
    restart: unless-stopped
    networks:
      - tap2eat-network

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: tap2eat-notification-service
    environment:
      SERVER_PORT: ${NOTIFICATION_HTTP_PORT}
      GRPC_SERVER_PORT: ${NOTIFICATION_GRPC_PORT}
      GMAIL_CREDENTIALS_PATH: ${GMAIL_CREDENTIALS_PATH}
      GMAIL_TOKENS_DIR: ${GMAIL_TOKENS_DIR}
      GMAIL_FROM: ${GMAIL_FROM}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-tap2eat}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-tap2eat}
      NOTIFICATION_ORDER_EXCHANGE: tap2eat.orders
      NOTIFICATION_ORDER_QUEUE: tap2eat.notifications.orders
      NOTIFICATION_ORDER_ROUTING_KEY: order.#
      NOTIFICATION_PAYMENT_EXCHANGE: tap2eat.payments
      NOTIFICATION_PAYMENT_QUEUE: tap2eat.notifications.payments
      NOTIFICATION_PAYMENT_ROUTING_KEY: payment.#
    volumes:
      - ../secrets/google/credentials.json:/run/secrets/google/credentials.json:ro
      - ../secrets/google/tokens:/run/secrets/google/tokens
    depends_on:
      - rabbitmq
    expose:
      - "${NOTIFICATION_HTTP_PORT}"
      - "${NOTIFICATION_GRPC_PORT}"
    restart: unless-stopped
    networks:
      - tap2eat-network

  order-service:
    build:
      context: ..
      dockerfile: services/order-service/Dockerfile
    container_name: tap2eat-order-service
    environment:
      ASPNETCORE_HTTP_PORTS: 8085
      MongoDb__ConnectionString: "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/tap2eat_orders?authSource=admin"
      MongoDb__DatabaseName: tap2eat_orders
      CatalogService__BaseUrl: "http://catalog-service:8082"
      CatalogService__InternalServiceToken: ${INTERNAL_SERVICE_TOKEN:-tap2eat-internal-dev-token}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-tap2eat}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-tap2eat}
      Jwt__PublicKeyPath: /run/secrets/jwt/public_key.pem
    volumes:
      - ../services/api-gateway/src/main/resources/keys/public_key.pem:/run/secrets/jwt/public_key.pem:ro
    depends_on:
      - mongodb
      - catalog-service
      - rabbitmq
    expose:
      - "8085"
    restart: unless-stopped
    networks:
      - tap2eat-network

  finance-service:
    build:
      context: ..
      dockerfile: services/finance-service/Dockerfile
    container_name: tap2eat-finance-service
    environment:
      ASPNETCORE_HTTP_PORTS: 8083
      Postgres__ConnectionString: "Host=postgres;Port=5432;Database=tap2eat_finance;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-tap2eat}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-tap2eat}
      RabbitMq__ExchangeName: tap2eat.orders
      RabbitMq__QueueName: tap2eat.finance.orders
      RabbitMq__RoutingKey: order.#
      RabbitMq__OrderExchangeName: tap2eat.orders
      RabbitMq__OrderQueueName: tap2eat.finance.orders
      RabbitMq__OrderRoutingKey: order.#
      RabbitMq__PaymentExchangeName: tap2eat.payments
      RabbitMq__PaymentExchangeType: topic
      RabbitMq__Enabled: true
      PaymentSimulation__Token: ${PAYMENT_SIMULATION_TOKEN:-tap2eat-payment-dev-token}
      PayPal__Mode: ${PAYPAL_MODE:-sandbox}
      PayPal__BaseUrl: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      PayPal__ClientId: ${PAYPAL_CLIENT_ID}
      PayPal__ClientSecret: ${PAYPAL_CLIENT_SECRET}
      PayPal__Currency: ${PAYPAL_CURRENCY:-MXN}
      Jwt__PublicKeyPath: /run/secrets/jwt/public_key.pem
    volumes:
      - ../services/api-gateway/src/main/resources/keys/public_key.pem:/run/secrets/jwt/public_key.pem:ro
    depends_on:
      - postgres
      - rabbitmq
    expose:
      - "8083"
    restart: unless-stopped
    networks:
      - tap2eat-network

  recommendation-service:
    build:
      context: ..
      dockerfile: services/recommendation-service/Dockerfile
    container_name: tap2eat-recommendation-service
    environment:
      ASPNETCORE_HTTP_PORTS: 8086
      Neo4j__Uri: "bolt://neo4j:7687"
      Neo4j__Username: ${NEO4J_USER}
      Neo4j__Password: ${NEO4J_PASSWORD}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-tap2eat}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:-tap2eat}
    depends_on:
      - neo4j
      - rabbitmq
    expose:
      - "8086"
    restart: unless-stopped
    networks:
      - tap2eat-network

  reports-python:
    build:
      context: ..
      dockerfile: services/reports-python/Dockerfile
    container_name: tap2eat-reports-python
    environment:
      ORDER_SERVICE_BASE_URL: http://order-service:8085
      CATALOG_SERVICE_BASE_URL: http://catalog-service:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-tap2eat-internal-dev-token}
      REQUEST_TIMEOUT_SECONDS: 10
    depends_on:
      - order-service
      - catalog-service
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - tap2eat-network
  

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tap2eat-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-tap2eat}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-tap2eat}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - tap2eat-network

  postgres:
    image: postgres:15
    container_name: tap2eat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - tap2eat-network

  mongodb:
    image: mongo:4.4
    container_name: tap2eat-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: tap2eat_catalog
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - tap2eat-network

  neo4j:
    image: neo4j:5-community
    container_name: tap2eat-neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    networks:
      - tap2eat-network

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:
  rabbitmq_data:

networks:
  tap2eat-network:
    driver: bridge
