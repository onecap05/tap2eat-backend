server.port=8080
spring.application.name=api-gateway
management.endpoints.web.exposure.include=health,info

spring.mvc.dispatch-options-request=true

spring.security.oauth2.resourceserver.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:classpath:keys/public_key.pem}


# identity-service
spring.cloud.gateway.server.webmvc.routes[0].id=identity-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://identity-service:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# catalog-service - restaurants
spring.cloud.gateway.server.webmvc.routes[1].id=catalog-restaurants
