spring.application.name=identity-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


jwt.expiration=${JWT_EXPIRATION:120000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.private-key-path=classpath:keys/private_key.pem
jwt.public-key-path=classpath:keys/public_key.pem

grpc.client.notification-service.address=static://notification-service:9091
grpc.client.notification-service.negotiationType=plaintext

auth.password.min-length=8
auth.email-verification-code.expiration-minutes=15
auth.password-reset-code.expiration-minutes=15

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

auth.test-seed.enabled=${AUTH_TEST_SEED_ENABLED:false}
auth.test-seed.email=${AUTH_TEST_SEED_EMAIL:}
auth.test-seed.password=${AUTH_TEST_SEED_PASSWORD:}
auth.test-seed.role=${AUTH_TEST_SEED_ROLE:CUSTOMER}
auth.test-seed.first-name=${AUTH_TEST_SEED_FIRST_NAME:CI}
auth.test-seed.last-name=${AUTH_TEST_SEED_LAST_NAME:User}
auth.test-seed.phone=${AUTH_TEST_SEED_PHONE:}