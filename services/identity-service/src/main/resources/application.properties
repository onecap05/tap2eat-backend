spring.application.name=identity-service
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

tap2eat.cors.allowed-origins=http://localhost:4200,file://

jwt.expiration=${JWT_EXPIRATION:120000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.private-key-path=classpath:keys/private_key.pem
jwt.public-key-path=classpath:keys/public_key.pem

grpc.client.notification-service.address=static://notification-service:9091
grpc.client.notification-service.negotiationType=plaintext