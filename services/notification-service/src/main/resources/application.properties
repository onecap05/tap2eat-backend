spring.application.name=notification-service
server.port=${SERVER_PORT:8084}
grpc.server.port=${GRPC_SERVER_PORT:9091}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:tap2eat}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:tap2eat}

tap2eat.rabbitmq.orders.exchange-name=${NOTIFICATION_ORDER_EXCHANGE:tap2eat.orders}
tap2eat.rabbitmq.orders.queue-name=${NOTIFICATION_ORDER_QUEUE:tap2eat.notifications.orders}
tap2eat.rabbitmq.orders.routing-key=${NOTIFICATION_ORDER_ROUTING_KEY:order.#}

gmail.credentials.path=${GMAIL_CREDENTIALS_PATH}
gmail.tokens.dir=${GMAIL_TOKENS_DIR}
gmail.from=${GMAIL_FROM}

notification.email.verification.expiration-minutes=15

gmail.application-name=Tap2Eat Notification Service

gmail.oauth.local-receiver-port=8888
